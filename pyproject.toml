[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foretravel-rvc"
version = "0.5.0rc4"
description = "Safety-gated SilverLeaf TM-102 RV-C integration for Venus OS"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
foretravel-rvc = "foretravel_rvc.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
